# Render settings for the Chabad of Lamorinda website.
services:
  # The original static website. Kept as-is so nothing that is live today breaks.
  - type: web
    name: chabad-lamorinda
    runtime: static
    staticPublishPath: .
    buildCommand: ""

  # Website + My Pushka app + Stripe card payments (a small Node server).
  - type: web
    name: chabad-lamorinda-app
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STRIPE_SECRET_KEY        # sk_test_... first, then sk_live_...  (set in the Render dashboard)
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY   # pk_test_... first, then pk_live_...  (set in the Render dashboard)
        sync: false
      - key: SESSION_SECRET           # generated for you
        generateValue: true

  # Bay Kosher Market inventory (inventory/). Needs a paid plan: it runs syncs in the
  # background all day and keeps its database on a disk. See inventory/README.md.
  - type: web
    name: baykosher-inventory
    runtime: node
    plan: starter
    rootDir: inventory
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Los_Angeles
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD               # the password you sign in with
        sync: false
      - key: CLOVER_MERCHANT_ID
        sync: false
      - key: CLOVER_API_TOKEN
        sync: false
      - key: CLOUDGROCER_API_URL
        value: https://baykosher.com/api
      - key: CLOUDGROCER_API_USER
        sync: false
      - key: CLOUDGROCER_API_PASSWORD
        sync: false
      - key: CLOUDGROCER_FTP_HOST
        value: ftp.mycloudgrocer.com
      - key: CLOUDGROCER_FTP_PORT
        value: "1175"
      - key: CLOUDGROCER_FTP_USER
        sync: false
      - key: CLOUDGROCER_FTP_PASSWORD
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_USER                  # the mailbox that receives supplier invoices
        sync: false
      - key: IMAP_PASSWORD              # a Google "app password", not the normal password
        sync: false
      - key: ANTHROPIC_API_KEY          # reads invoices
        sync: false
