<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light"><meta name="theme-color" content="#2a0f08">
<title>Kiddush Sponsors — Chabad Lamorinda</title>
<link rel="icon" href="../img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../tv.css"><link rel="stylesheet" href="../tv-light.css">
</head><body>
<main id="stage" aria-live="polite">
  <div class="col" id="c0"></div><div class="col" id="c1"></div>
  <section class="center">
    <div class="clock" id="clock" aria-hidden="true"></div>
    <header class="brand">
      <div class="bh" lang="he">ב״ה</div>
      <img src="../img/logo.svg" alt="" class="mark">
      <div class="org"><span data-t="CHABAD">CHABAD</span><br><span data-t="LAMORINDA">LAMORINDA</span></div>
    </header>
    <h1 class="title" data-t="KIDDUSH SPONSORS">KIDDUSH SPONSORS</h1>
    <div class="year" id="year"><span id="yearNum"></span> <span class="dash">-</span> <span id="yearHe" lang="he"></span></div>
    <div class="plate" id="plate">
      <i class="rivet r1"></i><i class="rivet r2"></i><i class="rivet r3"></i><i class="rivet r4"></i>
      <div class="plate-in" id="plateIn"><div class="loading" data-t="Loading…">Loading…</div></div>
    </div>
    <p class="blessing" id="blessing"></p>
    <div class="donor" id="donor" hidden></div>
  </section>
  <div class="col" id="c2"></div><div class="col" id="c3"></div>
</main>
<div id="offline" hidden data-t="Reconnecting…">Reconnecting…</div>
<button id="langBtn" class="lang-btn" type="button">עברית</button>
<script src="../vendor/qrcode.js"></script><script src="../i18n.js"></script><script src="../tv.js"></script>
</body></html>
